<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Gestão Jurídica</title>
<meta name="theme-color" content="#0b1220" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<style>
:root{
  --bg:#0b1220; --bg-elev:#111b2e; --bg-card:#141f36; --border:#22304d;
  --gold:#c9a24b; --gold-soft:#e4c67a;
  --text:#e7ecf5; --text-dim:#9aa8c2; --text-faint:#66748f;
  --ok:#5fbf8f; --warn:#e0a940; --danger:#e0645f;
  --radius:14px;
  font-size:16px;
}
*{box-sizing:border-box;}
body{
  margin:0;color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1100px 560px at 12% -8%, rgba(201,162,75,.09), transparent 60%),
    radial-gradient(900px 700px at 105% 10%, rgba(95,130,191,.10), transparent 55%),
    linear-gradient(165deg,#0b1220 0%,#0d1730 45%,#0a0f1c 100%);
  background-attachment:fixed;
  min-height:100vh;
}
h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0 0 4px;letter-spacing:-.01em;}
h1{font-size:1.7rem;} h2{font-size:1.22rem;} h3{font-size:1.02rem;color:var(--gold-soft);}
.mono{font-family:'IBM Plex Mono',monospace;}
a{color:inherit;text-decoration:none;}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 22;vertical-align:middle;font-size:20px;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:0.95rem;}
button,a,.list-card,.tab,.check-circle,input,select,textarea{transition:background-color .15s ease,border-color .15s ease,color .15s ease,box-shadow .15s ease,transform .15s ease;}

#app{min-height:100vh;display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;z-index:20;background:rgba(11,18,32,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:13px 16px;display:flex;align-items:center;justify-content:space-between;}
.topbar .brand{display:flex;align-items:center;gap:9px;}
.topbar .brand .material-symbols-outlined{color:#1a1406;background:linear-gradient(135deg,var(--gold),var(--gold-soft));width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;}
.topbar .brand span{font-family:'Fraunces',serif;font-weight:600;font-size:1.08rem;}
.iconbtn{background:none;border:none;color:var(--text-dim);padding:7px;border-radius:9px;display:flex;}
.iconbtn:hover{background:var(--bg-elev);color:var(--text);}

.content{flex:1;padding:16px;padding-bottom:88px;max-width:720px;margin:0 auto;width:100%;}

.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(17,27,46,.92);backdrop-filter:blur(10px);border-top:1px solid var(--border);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;color:var(--text-faint);font-size:.68rem;}
.tabbar a.active{color:var(--gold);}
.tabbar a .material-symbols-outlined{font-size:22px;}

.card{
  background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0)) , var(--bg-card);
  border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:12px;
  box-shadow:0 10px 28px -18px rgba(0,0,0,.6);
}
.kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.kpi{
  background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0)) , var(--bg-card);
  border:1px solid var(--border);border-radius:var(--radius);padding:14px;position:relative;overflow:hidden;
}
.kpi::before{content:"";position:absolute;top:0;left:0;width:3px;height:100%;background:linear-gradient(180deg,var(--gold),transparent);}
.kpi .num{font-family:'IBM Plex Mono',monospace;font-size:1.7rem;color:var(--gold-soft);}
.kpi .label{color:var(--text-dim);font-size:.78rem;margin-top:2px;}

.section-title{display:flex;align-items:center;justify-content:space-between;margin:24px 0 10px;}
.section-title h2{margin:0;position:relative;padding-left:12px;}
.section-title h2::before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:3px;border-radius:2px;background:var(--gold);}

.list-card{
  display:block;background:var(--bg-card);border:1px solid var(--border);border-left:3px solid transparent;
  border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;
}
.list-card.link{border-left-color:transparent;}
.list-card.link:hover{border-left-color:var(--gold);background:var(--bg-elev);transform:translateY(-1px);box-shadow:0 10px 24px -16px rgba(0,0,0,.55);}
.list-card.link:active{transform:translateY(0);}
.list-card-title{font-weight:600;font-size:1rem;}
.list-card-subtitle{color:var(--text-dim);font-size:.85rem;margin-top:3px;}
.list-card-notes{color:var(--text-dim);font-size:.88rem;margin-top:6px;line-height:1.4;}
.list-card-link{color:var(--gold-soft);font-size:.85rem;display:inline-block;margin-top:4px;word-break:break-all;}

.status-tag{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;padding:3px 10px 3px 8px;border-radius:99px;font-weight:600;letter-spacing:.02em;}
.status-tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
.status-tag.ativo{background:rgba(95,191,143,.14);color:var(--ok);}
.status-tag.suspenso{background:rgba(224,169,64,.14);color:var(--warn);}
.status-tag.concluido{background:rgba(154,168,194,.14);color:var(--text-dim);}
.status-tag.ok{background:rgba(95,191,143,.14);color:var(--ok);}
.status-tag.prazo{background:rgba(224,100,95,.14);color:var(--danger);}

.empty-state{color:var(--text-faint);font-size:.9rem;text-align:center;padding:32px 14px;border:1px dashed var(--border);border-radius:var(--radius);}

.page-header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px;}
.back-link{display:flex;align-items:center;gap:2px;color:var(--text-dim);font-size:.85rem;margin-bottom:6px;}
.back-link:hover{color:var(--text);}

.btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold-soft));color:#1a1406;border:none;border-radius:10px;padding:11px 18px;font-weight:600;font-size:.92rem;box-shadow:0 8px 20px -8px rgba(201,162,75,.55);}
.btn-primary:hover{filter:brightness(1.05);}
.btn-primary:active{transform:translateY(1px);}
.btn-primary:disabled{opacity:.6;box-shadow:none;}
.btn-secondary{background:var(--bg-elev);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px 16px;font-size:.88rem;}
.btn-secondary:hover{border-color:var(--gold);color:var(--gold-soft);}
.btn-danger{background:rgba(224,100,95,.12);color:var(--danger);border:1px solid rgba(224,100,95,.3);border-radius:10px;padding:9px 14px;font-size:.85rem;}
.btn-danger:hover{background:rgba(224,100,95,.2);}
.btn-link{background:none;border:none;color:var(--text-faint);font-size:.82rem;text-decoration:underline;padding:4px 0;}
.btn-link:hover{color:var(--text-dim);}
.btn-block{width:100%;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}

.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--border);margin-bottom:16px;-webkit-overflow-scrolling:touch;}
.tab{background:none;border:none;color:var(--text-faint);padding:9px 4px;margin-right:16px;font-size:.86rem;white-space:nowrap;border-bottom:2px solid transparent;}
.tab:hover{color:var(--text-dim);}
.tab.active{color:var(--gold-soft);border-bottom-color:var(--gold);}

.form label{display:block;font-size:.82rem;color:var(--text-dim);margin-bottom:14px;}
.form label > span{display:block;margin-bottom:5px;}
.form input, .form select, .form textarea{width:100%;background:var(--bg-elev);border:1px solid var(--border);border-radius:9px;padding:10px 12px;color:var(--text);}
.form input:focus, .form select:focus, .form textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,75,.15);}
.form textarea{resize:vertical;min-height:64px;}
.inline-form{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.inline-form input{flex:1;min-width:110px;background:var(--bg-elev);border:1px solid var(--border);border-radius:9px;padding:9px 11px;color:var(--text);}
.inline-form input:focus{outline:none;border-color:var(--gold);}

.info-grid{display:flex;flex-direction:column;gap:14px;}
.info-block{border-left:2px solid var(--border);padding-left:12px;}
.info-block .info-label{color:var(--text-faint);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;}
.info-block .info-value{color:var(--text);font-size:.92rem;line-height:1.5;white-space:pre-wrap;}

.checklist-group{margin-bottom:16px;}
.checklist{list-style:none;margin:0;padding:0;}
.checklist li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.checklist li:last-child{border-bottom:none;}
.checklist li span{flex:1;font-size:.92rem;}
.checklist li.done span{color:var(--text-faint);text-decoration:line-through;}
.check-circle{width:21px;height:21px;border-radius:50%;border:2px solid var(--text-faint);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.check-circle:hover{border-color:var(--gold-soft);}
.check-circle.checked{background:linear-gradient(135deg,var(--gold),var(--gold-soft));border-color:var(--gold);}
.check-circle.checked .material-symbols-outlined{font-size:14px;color:#1a1406;}

.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.auth-card{width:100%;max-width:360px;}
.auth-card .material-symbols-outlined.logo{font-size:26px;color:#1a1406;background:linear-gradient(135deg,var(--gold),var(--gold-soft));width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px -10px rgba(201,162,75,.6);}
.auth-card h1{margin:16px 0 4px;}
.auth-card p{color:var(--text-dim);font-size:.88rem;margin:0 0 22px;}
.auth-switch{text-align:center;margin-top:16px;font-size:.86rem;color:var(--text-dim);}
.auth-switch a{color:var(--gold-soft);font-weight:600;}
.error-msg{background:rgba(224,100,95,.12);border:1px solid rgba(224,100,95,.3);color:#f0a19d;padding:10px 12px;border-radius:9px;font-size:.85rem;margin-bottom:14px;}

.searchbar{display:flex;align-items:center;gap:8px;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:11px 14px;margin-bottom:18px;}
.searchbar:focus-within{border-color:var(--gold);}
.searchbar input{flex:1;background:none;border:none;color:var(--text);font-size:.95rem;}
.searchbar input:focus{outline:none;}
.searchbar .material-symbols-outlined{color:var(--text-faint);}
.search-group-label{color:var(--text-faint);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;margin:16px 0 8px;}

.loading{display:flex;align-items:center;justify-content:center;min-height:60vh;color:var(--text-faint);}
.fab-add{position:fixed;bottom:78px;right:16px;z-index:19;background:linear-gradient(135deg,var(--gold),var(--gold-soft));color:#1a1406;border:none;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px -8px rgba(0,0,0,.5);}

/* ---------- Desktop layout (monitores largos) ---------- */
.layout{display:flex;min-height:100vh;}
.sidebar{display:none;}
.main{flex:1;min-width:0;}
.grid-list{display:block;}

@media (min-width:900px){
  .sidebar{
    display:flex;flex-direction:column;width:236px;flex-shrink:0;
    background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,0)), var(--bg-elev);
    border-right:1px solid var(--border);
    padding:22px 14px;position:sticky;top:0;height:100vh;
  }
  .sidebar .brand{display:flex;align-items:center;gap:10px;padding:0 8px;margin-bottom:28px;}
  .sidebar .brand .material-symbols-outlined{color:#1a1406;background:linear-gradient(135deg,var(--gold),var(--gold-soft));width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:19px;}
  .sidebar .brand span{font-family:'Fraunces',serif;font-weight:600;font-size:1.12rem;}
  .sidebar-links{display:flex;flex-direction:column;gap:2px;flex:1;}
  .sidebar-links a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:var(--text-dim);font-size:.92rem;border-left:3px solid transparent;}
  .sidebar-links a:hover{background:rgba(255,255,255,.03);}
  .sidebar-links a.active{background:rgba(201,162,75,.12);color:var(--gold-soft);font-weight:600;border-left-color:var(--gold);}
  .sidebar-links a .material-symbols-outlined{font-size:21px;}
  .sidebar-logout{display:flex;align-items:center;gap:10px;background:none;border:1px solid var(--border);color:var(--text-dim);padding:10px 12px;border-radius:10px;font-size:.86rem;margin-top:8px;}
  .sidebar-logout:hover{color:var(--text);border-color:var(--text-faint);}
  .sidebar-logout.active-cfg{border-color:var(--gold);color:var(--gold-soft);}

  .topbar{display:none;}
  .tabbar{display:none;}

  .content{max-width:900px;padding:36px 44px;margin:0;}

  .grid-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-items:start;}
  .grid-list .list-card{margin-bottom:0;}

  .kpi-row{grid-template-columns:repeat(4,1fr);}
  .auth-wrap{padding:24px;}
}

@media (min-width:1400px){
  .content{max-width:1180px;padding:44px 64px;}
  .grid-list{grid-template-columns:repeat(auto-fill,minmax(320px,1fr));}
}
</style>
</head>
<body>
<div id="app">
  <div class="loading">Carregando…</div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
